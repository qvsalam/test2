services:
  - type: web
    name: iraq-stremio-addon
    runtime: node
    rootDir: .
    buildCommand: cd stremio-addon && npm install
    startCommand: node stremio-addon/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VLESS_URL
        sync: false
      - key: PROXY_TOKEN
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: PROVIDERS_DIR
        value: providers
      - key: PROXY_STREAMS
        value: "true"
      - key: STREAM_HOSTS
        value: "movie.vodu.me,isp.vodu.me,cinema.albox.co,pucinema.albox.co,cinemana.shabakaty.cc,cinemana.shabakaty.com,api-cinema.shashety.com,apitv.shashety.com,cdn.shashety.com"
